const KEY='rota_nomeacao_simulados_v1', REV='2026-11-20-20q';
const icons={compass:'<circle cx="12" cy="12" r="9"/><path d="m16 8-2.7 5.3L8 16l2.7-5.3L16 8Z"/>',dashboard:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',book:'<path d="M12 5v16M3 3c4-1 7 0 9 2 2-2 5-3 9-2v16c-4-1-7 0-9 2-2-2-5-3-9-2V3Z"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/>',check:'<path d="m5 12 4 4L19 6"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',shield:'<path d="m12 3 8 3v6c0 4-4 7-8 9-4-2-8-5-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/>',chart:'<path d="M4 4v16h17M8 16v-5m5 5V7m5 9v-8"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/>'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[n]||icons.book}</svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let storageOK=true,storageMessage='',state,modalType=null,returnFocus=null;
const initial=()=>({version:1,revision:REV,name:'',view:'dashboard',blocks:{1:null,2:null},history:[],updatedAt:null});
function validAttempt(a,block){if(!a||typeof a!=='object'||!a.answers||typeof a.answers!=='object')return false;if(!Number.isInteger(a.cursor)||a.cursor<0||a.cursor>9)return false;for(const [id,v]of Object.entries(a.answers)){if(!QUESTIONS.some(q=>q.id===id&&q.id.startsWith(`S${block}-`))||!v||!Number.isInteger(v.selected)||v.selected<0||v.selected>4||typeof v.confirmed!=='boolean'||!['S','D','C',''].includes(v.confidence))return false;}return true;}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return initial();const d=JSON.parse(raw);if(d.version!==1||d.revision!==REV||typeof d.name!=='string'||d.name.length>40||!d.blocks||!Array.isArray(d.history)||!['dashboard','simulados','errors','guide','quiz:1','quiz:2','result:1','result:2'].includes(d.view))throw Error('invalid');for(const b of [1,2])if(d.blocks[b]!==null&&!validAttempt(d.blocks[b],b))throw Error('invalid');return d;}catch(e){storageMessage='O progresso anterior não pôde ser lido. Uma nova sessão foi aberta; os dados antigos não serão usados.';return initial();}}
state=load();
try{localStorage.setItem(KEY+'_check','1');localStorage.removeItem(KEY+'_check');}catch(e){storageOK=false;storageMessage='O navegador bloqueou o armazenamento. Você pode treinar, mas o progresso desta sessão não será salvo.';}
function save(){state.updatedAt=new Date().toISOString();if(!storageOK)return;try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;storageMessage='Não foi possível salvar. O progresso desta sessão pode ser perdido ao fechar ou recarregar a página.';}}
const blockQs=b=>QUESTIONS.filter(q=>q.id.startsWith(`S${b}-`));
function totals(b){const a=state.blocks[b];const confirmed=blockQs(b).filter(q=>a?.answers[q.id]?.confirmed);return{done:confirmed.length,right:confirmed.filter(q=>a.answers[q.id].selected===q.key).length,wrong:confirmed.filter(q=>a.answers[q.id].selected!==q.key).length};}
function overall(){const a=totals(1),b=totals(2);return{done:a.done+b.done,right:a.right+b.right,wrong:a.wrong+b.wrong,completed:Number(a.done===10)+Number(b.done===10)};}
function attempt(b){if(!state.blocks[b]){state.blocks[b]={cursor:0,answers:{},startedAt:new Date().toISOString(),completedAt:null};}return state.blocks[b];}
function nextBlock(){return[1,2].find(b=>state.blocks[b]&&totals(b).done<10)||[1,2].find(b=>totals(b).done<10)||1;}
function go(view){state.view=view;save();render();window.scrollTo({top:0,behavior:'auto'});}
function openBlock(b){const a=attempt(b);go(totals(b).done===10?`result:${b}`:`quiz:${b}`);}
function storageNote(){return `<div class="storage-info">${icon('shield')}<div><strong>Seu progresso fica neste navegador.</strong> Ele não é enviado para um banco de dados nem sincronizado entre dispositivos. Limpar os dados do navegador, usar modo privado ou mudar o endereço da página pode apagar ou separar o histórico. ${storageOK?'':'<strong>Armazenamento indisponível nesta sessão.</strong>'}</div></div>`;}
function shell(content){const v=state.view.split(':')[0];const nav=[['dashboard','dashboard','Dashboard'],['simulados','book','Simulados'],['errors','target','Meus erros'],['guide','info','Como funciona']];return `<aside class="sidebar"><div class="brand">${icon('compass')}<div><strong>Rota da<br>Nomeação</strong><span>ÁREA DE TREINO</span></div></div><nav class="nav" aria-label="Navegação principal">${nav.map(([id,ic,label])=>`<button data-go="${id}" class="${v===id||id==='simulados'&&['quiz','result'].includes(v)?'active':''}" aria-label="${label}">${icon(ic)}<span>${label}</span></button>`).join('')}</nav><div class="side-note">${icon('lock')}<strong>Seu espaço de evolução.</strong>Um treino de cada vez.<br>Seu progresso fica com você.</div></aside><main class="main"><header class="topbar"><span class="crumb">Área de estudo <span style="margin:0 10px">/</span> Gestão de sala de aula</span><span class="mobile-brand">ROTA DA NOMEAÇÃO</span><button class="profile" data-action="edit-name" aria-label="Editar nome"><span class="avatar">${esc(state.name.trim().slice(0,1).toUpperCase()||'R')}</span><span><strong class="profile-name">${esc(state.name||'Seu perfil')}</strong><span class="small muted" style="display:block;font-size:10px">Editar nome</span></span></button></header><div class="content">${storageMessage?`<div class="alert" role="alert">${esc(storageMessage)}</div>`:''}${content}${storageNote()}<footer class="footer">Rota da Nomeação • Questões autorais de prática pedagógica. Sem vínculo com a banca ou com a SEDUC-SP.</footer></div></main>`;}
function examCard(b){const t=totals(b),a=state.blocks[b],done=t.done===10;return `<article class="card"><div class="exam-cover ${b===2?'second':''}"><span>GESTÃO DE SALA DE AULA</span><b>0${b}</b></div><div class="row"><span class="eyebrow muted">SIMULADO ${b}</span><span class="status ${done?'done':a?'running':''}">${done?'CONCLUÍDO':a?'EM ANDAMENTO':'PARA COMEÇAR'}</span></div><h3>${b===1?'Diagnóstico pedagógico':'Aplicação e tomada de decisão'}</h3><p class="exam-meta">10 questões autorais • 5 alternativas</p><div class="progress-label"><span>${t.done}/10 corrigidas</span><span>${t.done*10}%</span></div><div class="track" role="progressbar" aria-label="Progresso do simulado ${b}" aria-valuemin="0" aria-valuemax="10" aria-valuenow="${t.done}"><i style="width:${t.done*10}%"></i></div>${done?`<p class="small muted" style="margin-top:11px">Resultado desta tentativa: <strong>${t.right}/10 acertos</strong></p>`:''}<button class="btn ${b===2?'outline':''} wide" data-open="${b}">${done?'Ver resultado':a?'Continuar simulado':'Começar simulado'} ${icon('arrow')}</button></article>`;}
function dashboard(simOnly=false){const t=overall(),pct=t.done?Math.round(t.right/t.done*100):0,b=nextBlock();const stat=(label,val,note,ic)=>`<div class="stat"><div class="stat-head">${label}${icon(ic)}</div><strong>${val}</strong><small>${note}</small></div>`;return `${simOnly?`<div class="greeting"><h1>Seus simulados</h1><p class="muted">Escolha um bloco ou continue de onde parou.</p></div>`:`<div class="row greeting"><div><h1>Olá, ${esc(state.name.split(' ')[0]||'estudante')}<span style="color:#b38d3d">.</span></h1><p class="muted">Sua próxima conquista começa com um bom treino.</p></div><span class="pill"><span class="dot"></span>${storageOK?'Salvamento automático':'Sessão sem salvamento'}</span></div><section class="hero"><div class="hero-copy"><div class="eyebrow">FOCO NO SEU PRÓXIMO PASSO</div><h2>Conhecimento ganha força<br>quando vira prática.</h2><p>Treine, entenda suas escolhas e transforme cada questão em uma oportunidade de aprender.</p><button class="btn gold" data-open="${b}">${t.completed===2?'Revisar meus resultados':state.blocks[b]?'Continuar meu treino':'Iniciar meu primeiro treino'} ${icon('arrow')}</button></div><div class="hero-art" role="img" aria-label="Mesa de estudo com livros, bússola e folha de respostas"></div></section><div class="stats">${stat('Questões corrigidas',`${t.done}<span style="font-size:16px;color:#94a49b"> / 20</span>`,'Nas tentativas atuais','book')}${stat('Acertos',t.right,`${t.wrong} ${t.wrong===1?'erro identificado':'erros identificados'}`,'check')}${stat('Aproveitamento',t.done?pct+'%':'—',t.done?'Acertos entre as corrigidas':'Aparece após a primeira correção','chart')}${stat('Blocos concluídos',`${t.completed}<span style="font-size:16px;color:#94a49b"> / 2</span>`,'Um passo de cada vez','target')}</div>`}<div class="row section-heading"><h2>Seu percurso de treino</h2><span class="tiny muted">20 questões • Bloco comum</span></div><div class="dashboard-grid"><div class="exam-grid">${examCard(1)}${examCard(2)}</div><div class="aside-stack"><section class="card next-step"><span class="label-icon">${icon('compass')}</span><h3>Seu próximo passo</h3><p>${t.wrong?'Volte às questões que pedem atenção. Os comentários mostram os mapas que você pode revisar.':t.done?'Siga com o treino e observe também as respostas em que ficou em dúvida.':'Comece pelo diagnóstico. Ele ajuda a identificar quais decisões pedagógicas você precisa aprofundar.'}</p><button class="btn link" ${t.wrong?'data-go="errors"':`data-open="${b}"`}>${t.wrong?'Revisar meus erros':'Ir para o treino'} ${icon('arrow')}</button></section><section class="card"><div class="eyebrow muted">UM TREINO COM PROPÓSITO</div><h3>Leia. Decida. Aprenda.</h3><p class="small muted">A correção explica a resposta e indica os mapas para retomar o assunto.</p></section></div></div>`;}
function feedback(q,a){const right=a.selected===q.key;return `<section class="feedback ${right?'':'error'}" role="status" aria-live="polite"><h3>${right?'✓ Você acertou.':'Vamos entender essa escolha.'}</h3><p><strong>Resposta correta: ${'ABCDE'[q.key]}.</strong> ${esc(q.explanation)}</p><details><summary>Análise das cinco alternativas</summary><ul>${q.alternatives.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details><p style="margin-top:16px;font-weight:700">Sua rota de revisão</p><div class="maps-list">${q.maps.map(m=>`<span class="map-chip">${esc(m.id)} · ${esc(m.title)}</span>`).join('')}</div><p class="tiny muted" style="margin-top:10px">Consulte esses códigos nos PDFs do produto principal. Os mapas não estão incorporados neste app.</p></section>`;}
function quiz(b){const a=attempt(b),qs=blockQs(b),q=qs[a.cursor],r=a.answers[q.id],t=totals(b);return `<button class="btn link" data-go="simulados">← Voltar aos simulados</button><div class="quiz-header"><div class="eyebrow muted">SIMULADO ${b} / GESTÃO DE SALA DE AULA</div><h1>${b===1?'Diagnóstico pedagógico':'Aplicação e tomada de decisão'}</h1><p class="small muted">Responda com calma. A explicação aparece depois de confirmar.</p></div><div class="quiz-layout"><section class="card question-card"><div class="question-tag">QUESTÃO ${String(a.cursor+1).padStart(2,'0')} DE 10 <span style="color:#bd9a48">/</span> ${esc(q.topic)}</div><h2 class="stem">${esc(q.stem)}</h2><fieldset style="border:0;padding:0;margin:0"><legend class="visually-hidden">Escolha uma alternativa</legend><div class="options">${q.options.map((opt,i)=>`<label class="option ${r?.selected===i?'selected':''} ${r?.confirmed&&i===q.key?'correct':''} ${r?.confirmed&&r.selected===i&&i!==q.key?'wrong':''}"><input type="radio" name="answer" value="${i}" ${r?.selected===i?'checked':''} ${r?.confirmed?'disabled':''}><span class="letter">${'ABCDE'[i]}</span><span>${esc(opt)}</span>${r?.confirmed&&(i===q.key||r.selected===i)?`<span class="mark">${i===q.key?'✓ Correta':'✕ Sua escolha'}</span>`:''}</label>`).join('')}</div></fieldset><div class="confidence"><span>Como você chegou à resposta?</span>${[['S','Com segurança'],['D','Com dúvida'],['C','Foi um chute']].map(([v,txt])=>`<button data-confidence="${v}" class="${r?.confidence===v?'active':''}" aria-pressed="${r?.confidence===v}" ${!r||r.confirmed?'disabled':''}>${txt}</button>`).join('')}</div>${r?.confirmed?feedback(q,r):''}<div class="question-actions"><button class="btn outline" data-step="-1" ${a.cursor===0?'disabled':''}>← Anterior</button>${r?.confirmed?`<button class="btn" ${t.done===10?'data-result="'+b+'"':'data-next="1"'}>${t.done===10?'Ver resultado':'Próxima questão'} ${icon('arrow')}</button>`:`<button class="btn" data-confirm="1" ${r?.selected===undefined?'disabled':''}>Confirmar resposta ${icon('check')}</button>`}</div></section><aside class="quiz-sidebar"><section class="card"><h3>Seu progresso</h3><p class="small muted">${t.done}/10 questões corrigidas</p><div class="track" style="margin-top:12px"><i style="width:${t.done*10}%"></i></div><div class="question-nav" aria-label="Navegar entre questões">${qs.map((q,i)=>{const v=a.answers[q.id],cls=v?.confirmed?(v.selected===q.key?'correct':'wrong'):v?'draft':'';return `<button data-question="${i}" class="${cls} ${a.cursor===i?'current':''}" aria-label="Questão ${i+1}${v?.confirmed?v.selected===q.key?', acerto':', erro':v?', selecionada':', pendente'}" ${a.cursor===i?'aria-current="step"':''}>${String(i+1).padStart(2,'0')}</button>`;}).join('')}</div><div class="legend"><span><i class="sq" style="background:#abd0b7"></i>Acerto</span><span><i class="sq" style="background:#e5b7a8"></i>Erro</span><span><i class="sq" style="background:#edd49b"></i>Rascunho</span></div><p class="small muted resume-note" style="margin-top:20px">Você pode sair e continuar depois. Uma alternativa selecionada só entra na pontuação após a confirmação.</p></section></aside></div>`;}
function result(b){const t=totals(b);if(t.done!==10)return quiz(b);const a=state.blocks[b],insecure=blockQs(b).filter(q=>['D','C'].includes(a.answers[q.id]?.confidence)).length;return `<button class="btn link" data-go="simulados">← Voltar aos simulados</button><section class="result-banner" style="margin-top:20px"><div><div class="eyebrow" style="color:#e1c27b;margin-bottom:10px">SIMULADO ${b} CONCLUÍDO</div><h1>Um treino a mais.<br>Mais clareza para avançar.</h1><p class="small" style="color:#bdd7d0;margin-top:12px">${t.wrong} erros para revisar · ${insecure} respostas com dúvida ou chute</p></div><div class="result-score">${t.right}<span style="font-size:21px;color:#b7c9c2">/10</span><div style="font-size:12px;letter-spacing:0;color:#c1d3cb;font-weight:400">${t.right*10}% de acertos</div></div></section><div class="row section-heading"><h2>Questão por questão</h2><button class="btn outline" data-restart="${b}">${icon('refresh')} Refazer</button></div><div class="review-list">${blockQs(b).map((q,i)=>{const ok=a.answers[q.id].selected===q.key;return `<article class="review-item"><div><span class="badge ${ok?'':'wrong'}">${ok?'✓ Acerto':'✕ Erro'} · ${q.id}</span><h3>${esc(q.topic)}</h3><span class="tiny muted">Sua resposta: ${'ABCDE'[a.answers[q.id].selected]} · Correta: ${'ABCDE'[q.key]}</span></div><button class="btn outline" data-review="${b}:${i}">Ver comentário</button></article>`;}).join('')}</div><div class="notice">Este resultado mede seu desempenho neste treino autoral. Não é uma nota oficial, previsão de classificação ou garantia de aprovação. Ao refazer, a tentativa atual será reiniciada; o resultado anterior ficará no resumo de tentativas abaixo.</div>${history(b)}`;}
function history(b){const h=state.history.filter(x=>x.block===b);return h.length?`<section class="card" style="margin-top:20px"><h3>Resumo das tentativas anteriores</h3>${h.slice(-5).reverse().map(x=>`<p class="small muted" style="margin-top:8px">${esc(new Date(x.date).toLocaleDateString('pt-BR'))} · ${Number(x.right)||0}/10 acertos · ${Number(x.done)||0}/10 corrigidas</p>`).join('')}</section>`:'';}
function errors(){const all=QUESTIONS.filter(q=>{const a=state.blocks[q.id[1]]?.answers[q.id];return a?.confirmed&&a.selected!==q.key;});return `<div class="greeting"><h1>Erros que viram aprendizado.</h1><p class="muted">${all.length?`${all.length} questões das tentativas atuais para retomar.`:'Sua rota de revisão aparece aqui depois das correções.'}</p></div>${all.length?`<div class="review-list">${all.map(q=>`<article class="review-item"><div><span class="badge wrong">${q.id} · Revisão recomendada</span><h3>${esc(q.topic)}</h3><p class="tiny muted">${q.maps.map(x=>esc(x.id)).join(' · ')}</p></div><button class="btn outline" data-review="${q.id[1]}:${blockQs(Number(q.id[1])).findIndex(x=>x.id===q.id)}">Revisar</button></article>`).join('')}</div>`:`<section class="empty">${icon('target')}<h2>Um bom lugar para evoluir.</h2><p class="muted">Conforme você treina, as questões respondidas incorretamente ficam reunidas aqui, com explicações e referências aos mapas.</p><button class="btn" data-go="simulados">Escolher um simulado ${icon('arrow')}</button></section>`}`;}
function guide(){return `<div class="greeting"><h1>Como funciona seu treino.</h1><p class="muted">Tudo o que você precisa para começar e continuar.</p></div><div class="guide-grid">${[['01','Seu perfil, seu percurso','Seu nome personaliza a experiência. Não é um login: quem usa este mesmo navegador e endereço pode acessar o progresso salvo.'],['02','Da resposta ao entendimento','Escolha uma alternativa e confirme. A escolha fica bloqueada para preservar a tentativa; a correção mostra acertos, erros e comentários. Use “Refazer” no resultado para começar outra tentativa.'],['03','Retome de onde parou','O app salva automaticamente suas seleções, correções e posição neste navegador, quando o armazenamento está disponível. Em caso de bloqueio, um aviso aparece na tela. Não há banco de dados ou sincronização.'],['04','O que você está estudando','Dois blocos de 10 questões autorais de gestão de sala de aula. Eles não substituem os conhecimentos específicos da sua disciplina nem a bibliografia integral do edital.'],['05','Sobre o aproveitamento','O dashboard calcula acertos divididos pelas questões já corrigidas nas tentativas atuais. Uma seleção ainda não confirmada não conta. Ao refazer um bloco, seus números atuais são reiniciados.'],['06','Abrir e publicar','Este arquivo funciona sem internet. Em arquivos locais, o salvamento pode variar entre navegadores. Para disponibilizar um link público, é necessário publicar o HTML em uma hospedagem. Mudar o endereço não transfere o progresso.']].map(([n,t,d])=>`<section class="card"><div class="eyebrow" style="color:#a1833d">PASSO ${n}</div><h3>${t}</h3><p>${d}</p></section>`).join('')}</div><div class="notice"><strong>Importante:</strong> limpar dados do navegador, usar modo privado, trocar de dispositivo ou abrir em outro endereço pode remover ou separar seu progresso. O arquivo não envia suas respostas a um servidor.</div>`;}
function render(){let c;if(state.view.startsWith('quiz:'))c=quiz(Number(state.view.slice(-1)));else if(state.view.startsWith('result:'))c=result(Number(state.view.slice(-1)));else c=state.view==='errors'?errors():state.view==='guide'?guide():dashboard(state.view==='simulados');document.getElementById('app').innerHTML=shell(c);if(!state.name&&!modalType)showName(false);}
function showName(edit){modalType=edit?'edit':'onboard';returnFocus=document.activeElement;document.getElementById('modal-root').innerHTML=`<div class="modal-wrap"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="emblem">${icon('compass')}</div><div class="eyebrow muted" style="margin-bottom:10px">ROTA DA NOMEAÇÃO</div><h2 id="modal-title">${edit?'Como podemos chamar você?':'Seu próximo passo começa aqui.'}</h2><p>${edit?'Atualize o nome que aparece no seu dashboard.':'Um espaço para praticar, aprender com as respostas e acompanhar sua evolução. Para começar, diga como você quer ser chamado.'}</p><form id="name-form"><label for="user-name">Seu nome</label><input id="user-name" name="user-name" autocomplete="given-name" maxlength="40" required value="${esc(state.name)}" placeholder="Como podemos chamar você?" aria-describedby="name-error"><div id="name-error" class="error-message" role="alert"></div><div class="actions">${edit?'<button type="button" class="btn outline" data-close="1">Cancelar</button>':''}<button class="btn" type="submit">${edit?'Salvar nome':'Entrar no meu dashboard'} ${icon('arrow')}</button></div></form><p class="tiny" style="margin-bottom:0">Sem cadastro. Seu nome e progresso ficam neste navegador.</p></section></div>`;setTimeout(()=>document.getElementById('user-name')?.focus(),0);}
function closeModal(){if(modalType==='onboard')return;modalType=null;document.getElementById('modal-root').innerHTML='';returnFocus?.focus();}
function showRestart(b){returnFocus=document.activeElement;modalType='restart';document.getElementById('modal-root').innerHTML=`<div class="modal-wrap"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">Refazer o simulado ${b}?</h2><p>As respostas deste bloco serão reiniciadas. Seu resultado anterior será guardado no resumo de tentativas; o dashboard passará a contar a nova tentativa.</p><div class="actions"><button class="btn outline" data-close="1">Cancelar</button><button class="btn" data-reset="${b}">Sim, começar de novo</button></div></section></div>`;setTimeout(()=>document.querySelector('[data-close]')?.focus(),0);}
document.addEventListener('submit',e=>{if(e.target.id!=='name-form')return;e.preventDefault();const name=document.getElementById('user-name').value.trim().replace(/\s+/g,' ');if(!name){document.getElementById('name-error').textContent='Digite um nome para continuar.';return;}state.name=name.slice(0,40);modalType=null;document.getElementById('modal-root').innerHTML='';save();render();});
document.addEventListener('change',e=>{if(e.target.name!=='answer')return;const b=Number(state.view.slice(-1)),a=attempt(b),q=blockQs(b)[a.cursor],old=a.answers[q.id];if(old?.confirmed)return;const v=Number(e.target.value);if(!Number.isInteger(v)||v<0||v>4)return;a.answers[q.id]={selected:v,confirmed:false,confidence:old?.confidence||''};save();render();document.querySelector(`input[value="${v}"]`)?.focus();});
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el||el.disabled)return;const d=el.dataset;if(d.go){go(d.go);return;}if(d.open){openBlock(Number(d.open));return;}if(d.action==='edit-name'){showName(true);return;}if(d.close){closeModal();return;}if(d.restart){showRestart(Number(d.restart));return;}if(d.reset){const b=Number(d.reset),t=totals(b);state.history.push({block:b,...t,date:new Date().toISOString()});state.history=state.history.slice(-20);state.blocks[b]=null;modalType=null;document.getElementById('modal-root').innerHTML='';attempt(b);go(`quiz:${b}`);return;}if(d.review){const[b,i]=d.review.split(':').map(Number);attempt(b).cursor=i;go(`quiz:${b}`);return;}if(d.result){go(`result:${d.result}`);return;}if(!state.view.startsWith('quiz:'))return;const b=Number(state.view.slice(-1)),a=attempt(b),qs=blockQs(b),q=qs[a.cursor],r=a.answers[q.id];if(d.confidence){if(r&&!r.confirmed){r.confidence=d.confidence;save();render();}return;}if(d.question!==undefined){a.cursor=Number(d.question);save();render();return;}if(d.step){a.cursor=Math.max(0,a.cursor-1);save();render();return;}if(d.next){a.cursor=(a.cursor+1)%10;if(totals(b).done<10&&a.answers[qs[a.cursor].id]?.confirmed){const idx=qs.findIndex(q=>!a.answers[q.id]?.confirmed);if(idx>=0)a.cursor=idx;}save();render();window.scrollTo({top:0,behavior:'auto'});return;}if(d.confirm&&r&&!r.confirmed){r.confirmed=true;if(totals(b).done===10)a.completedAt=new Date().toISOString();save();render();document.querySelector('.feedback')?.scrollIntoView({block:'nearest',behavior:'auto'});}});
document.addEventListener('keydown',e=>{if(!modalType)return;if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){const all=[...document.querySelectorAll('#modal-root button,#modal-root input')].filter(x=>!x.disabled);const first=all[0],last=all[all.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('storage',e=>{if(e.key!==KEY)return;storageMessage='O progresso foi alterado em outra aba. Recarregue esta página antes de continuar para usar a versão mais recente.';render();});
render();
</script></body></html>
