function load(){try{const raw=localStorage.getItem(storeKey);if(!raw)return fresh();const d=JSON.parse(raw);if(d.version!==1||typeof d.name!=='string'||!Array.isArray(d.done)||!Array.isArray(d.selected))throw Error('Formato inválido');d.done=[...new Set(d.done.filter(i=>allIds.has(i)))];d.selected=[...new Set(d.selected.filter(i=>allIds.has(i)))];d.last=allIds.has(d.last)?d.last:null;d.name=d.name.slice(0,40);if(!/^(home|beginner|queue|tips|progress|bonus|assistant|module:(?:[1-9]|1[0-2]))$/.test(d.view))d.view='home';return d;}catch(e){warning='Não foi possível ler o progresso anterior. A área abriu uma nova sessão.';return fresh();}}
function save(){state.updated=new Date().toISOString();if(!localOK)return;try{localStorage.setItem(storeKey,JSON.stringify(state));}catch(e){localOK=false;warning='O navegador não conseguiu salvar. As alterações desta sessão podem se perder ao fechar a página.';}}
function doneCount(ids=archive.items.map(i=>i.id)){return ids.filter(i=>state.done.includes(i)).length;}
const byId=id=>archive.items.find(i=>i.id===Number(id));
function moduleCount(m){return doneCount(archive.items.filter(i=>i.module===m).map(i=>i.id));}
function go(view){state.view=view;level='Todos';search='';menuOpen=false;save();render();window.scrollTo({top:0,behavior:'auto'});}
function getNext(){if(state.last&&!state.done.includes(state.last))return byId(state.last);return archive.items.find(i=>!state.done.includes(i.id))||archive.items[0];}
function side(){const current=state.view;const navs=[['home','home','Minha área'],['beginner','route','Caminho inicial'],['queue','print','Fila de impressão'],['bonus','gift','Bônus e simulado'],['assistant','clipboard','InfoApp · Discursiva e aula'],['progress','chart','Meu progresso'],['tips','info','Dicas de uso']];return `<aside class="side ${menuOpen?'open':''}" aria-label="Menu da área"><div class="brand">${icon('compass')}<div><strong>Rota da<br>Nomeação</strong><small>SEE-SP / ÁREA DE ESTUDO</small></div></div><div class="side-scroll"><nav class="nav" aria-label="Navegação principal">${navs.map(([v,ic,t])=>`<button data-go="${v}" class="${current===v?'active':''}">${icon(ic)}<span>${t}</span></button>`).join('')}</nav><div class="nav-title">SEUS MÓDULOS</div><nav class="nav module-nav" aria-label="Módulos">${archive.modules.map((m,i)=>`<button data-go="module:${m.id}" class="${current===`module:${m.id}`?'active':''}">${icon(moduleIcons[i])}<span>${escapeText(m.title)}</span><b>${moduleCount(m.id)}/${m.count}</b></button>`).join('')}</nav></div><div class="side-bottom"><div class="row"><strong>Seu progresso</strong><span>${doneCount()}/150</span></div><div class="track gold"><i style="width:${doneCount()/150*100}%"></i></div><small>${doneCount()} de 150 mapas concluídos</small></div></aside>`;}
function note(){return `<div class="note">${icon('shield')}<div><strong>Progresso salvo neste navegador.</strong> Não há login nem sincronização entre dispositivos. Limpar os dados, usar modo privado ou mudar o endereço pode apagar ou separar seu progresso. ${localOK?'':'O armazenamento está indisponível nesta sessão.'}</div></div>`;}
function frame(body){return `${side()}<main class="main"><header class="topbar"><div class="top-left"><button class="btn outline menu-button" data-menu="1" aria-label="Abrir menu" aria-expanded="${menuOpen}">${icon('menu')}</button><div class="top-label">Seu espaço de estudo <b> / SEE-SP</b></div></div><button class="person" data-profile="1" aria-label="Editar nome"><span class="avatar">${escapeText(state.name.slice(0,1).toUpperCase()||'R')}</span><span><strong>${escapeText(state.name||'Seu perfil')}</strong><small>Editar nome</small></span></button></header><div class="content" id="main-content" tabindex="-1">${warning?`<div class="alert" role="alert">${escapeText(warning)}</div>`:''}${body}${note()}<footer class="footer">Rota da Nomeação • Material de estudo autoral. Sem vínculo com a banca ou com a SEDUC-SP.</footer></div></main>`;}
function moduleCard(m){const d=moduleCount(m.id);return `<article class="module-card"><div class="module-art"><img src="${asset(m.cover)}" alt="Capa: ${escapeText(m.title)}" loading="lazy" decoding="async">${icon(moduleIcons[m.id-1])}</div><div class="module-body"><div class="eyebrow">MÓDULO ${String(m.id).padStart(2,'0')}</div><h3>${escapeText(m.title)}</h3><div class="progress-label"><span>${d} de ${m.count} concluídos</span><span>${Math.round(d/m.count*100)}%</span></div><div class="track"><i style="width:${d/m.count*100}%;${d===m.count?'background:var(--gold)':''}"></i></div><button class="btn outline" data-go="module:${m.id}">Abrir módulo</button></div></article>`;}
function home(){const n=getNext(),pct=Math.round(doneCount()/150*100),finished=archive.modules.filter(m=>moduleCount(m.id)===m.count).length;const shortcuts=[['beginner','route','Caminho inicial','Os primeiros passos'],['queue','print','Fila de impressão',`${state.selected.length} mapas selecionados`],['bonus','gift','Bônus e simulado','Ferramentas de treino'],['assistant','clipboard','InfoApp de treino','Discursiva e videoaula']];return `<div class="row page-head"><div><h1>Seu estudo, com direção.</h1><p>${state.name?`Olá, ${escapeText(state.name.split(' ')[0])}. `:''}Seu material organizado. Seu próximo passo sempre à mão.</p></div><span class="pill">${icon('shield')}Salvamento local</span></div><section class="hero"><div class="hero-copy"><div class="eyebrow">ROTA DA NOMEAÇÃO / SEE-SP</div><h2>Um mapa por vez.<br>Mais clareza no seu percurso.</h2><p>${doneCount()===150?'Você percorreu todos os mapas. Volte aos pontos que quer consolidar e siga com os treinos.':`Continue em ${escapeText(n.code)}: ${escapeText(n.title)}.`}</p><button class="btn light" data-open="${n.id}">${state.last?'Continuar de onde parei':'Começar meu estudo'}</button></div><div class="ring" style="--p:${pct}" aria-label="${pct}% dos mapas concluídos"><div class="ring-inner"><strong>${pct}%</strong><small>DO SEU PERCURSO</small></div></div></section><div class="shortcuts">${shortcuts.map(([v,ic,t,d])=>`<button class="shortcut" data-go="${v}">${icon(ic)}<div><b>${t}</b><span>${d}</span></div></button>`).join('')}</div><div class="stats">${[[150,'Mapas visuais','book'],[12,'Módulos organizados','compass'],[4,'Bônus e ferramentas','gift'],[finished,'Módulos concluídos','trophy']].map(([v,t,ic])=>`<div class="stat">${icon(ic)}<div><strong>${v}</strong><span>${t}</span></div></div>`).join('')}</div><div class="section-title"><h2>Explore seus módulos</h2><p>Abra um assunto, acompanhe a leitura e imprima apenas os mapas que escolher.</p></div><div class="grid">${archive.modules.map(moduleCard).join('')}</div>`;}
function currentItems(){let items=state.view.startsWith('module:')?archive.items.filter(i=>i.module===Number(state.view.split(':')[1])):state.view==='beginner'?archive.items.filter(i=>i.level==='Básico'):state.view==='queue'?archive.items.filter(i=>state.selected.includes(i.id)):archive.items;return items;}
function visibleItems(){return currentItems().filter(i=>(level==='Todos'||i.level===level)&&(!search||`${i.title} ${i.code}`.toLocaleLowerCase('pt-BR').includes(search.toLocaleLowerCase('pt-BR'))));}
function mapCard(i){const d=state.done.includes(i.id),sel=state.selected.includes(i.id);return `<article class="map-card ${d?'done':''}" data-card="${i.id}"><label class="check-select"><input type="checkbox" data-select="${i.id}" ${sel?'checked':''} aria-label="Selecionar ${escapeText(i.code)} para impressão"></label><button class="preview-btn" data-open="${i.id}" aria-label="Abrir ${escapeText(i.title)} em tela cheia"><img src="${asset(i.thumb)}" alt="${escapeText(i.code)} - ${escapeText(i.title)}" loading="lazy" decoding="async"></button><div class="map-body"><div class="map-top"><span class="map-code">${i.code}</span><span class="level ${i.level==='Avançado'?'advanced':i.level==='Intermediário'?'middle':''}">${i.level}</span></div><h3>${escapeText(i.title)}</h3><div class="map-actions"><button class="btn ${d?'complete':'outline'} done-btn" data-done="${i.id}" aria-pressed="${d}">${icon(d?'check':'book')}${d?'Concluído':'Marcar como estudado'}</button><button class="btn outline print-btn" data-print="${i.id}" aria-label="Imprimir somente ${i.code}">${icon('print')}</button></div></div></article>`;}
function collection(){const m=state.view.startsWith('module:')?archive.modules.find(m=>m.id===Number(state.view.split(':')[1])):null;const title=m?m.title:state.view==='beginner'?'Um caminho para começar.':'Sua fila de impressão.';const base=currentItems(),vis=visibleItems();const desc=m?`${m.count} mapas para estudar, revisar e consultar. O nível é uma organização didática sugerida, não uma classificação oficial da prova.`:state.view==='beginner'?'Os mapas classificados como básicos, em ordem de módulo. Use esta trilha como ponto de partida e avance depois para os demais assuntos.':'Selecione mapas em qualquer módulo. A fila fica salva neste navegador até você remover os itens.';return `<div class="page-head"><div class="eyebrow muted" style="margin-bottom:9px">${m?`MÓDULO ${String(m.id).padStart(2,'0')}`:state.view==='beginner'?'CAMINHO INICIAL':'IMPRIMIR NO SEU RITMO'}</div><div class="row"><h1>${escapeText(title)}</h1>${m?`<a class="btn outline" href="${asset(m.pdf)}" target="_blank" rel="noopener" download>${icon('download')}PDF</a>`:''}</div><p>${desc}</p></div><div class="toolbar"><div class="filters" role="group" aria-label="Filtro por nível">${['Todos',...levels].map(l=>`<button class="filter ${level===l?'active':''}" data-level="${l}" aria-pressed="${level===l}">${l}<b>${l==='Todos'?base.length:base.filter(i=>i.level===l).length}</b></button>`).join('')}</div><input class="search" id="search-maps" type="search" placeholder="Buscar por título ou código" aria-label="Buscar mapas" value="${escapeText(search)}"></div><div class="row" style="margin-bottom:17px"><span class="small muted" id="result-count">${vis.length} mapas encontrados</span>${vis.length?`<label class="select-all"><input type="checkbox" data-select-all="1" ${vis.every(i=>state.selected.includes(i.id))?'checked':''}>Selecionar os visíveis</label>`:''}</div>${vis.length?`<div class="maps-grid">${vis.map(mapCard).join('')}</div>`:`<div class="empty">${icon(state.view==='queue'?'print':'book')}<h2>${state.view==='queue'&&base.length===0?'Sua fila ainda está vazia.':'Nenhum mapa nesta busca.'}</h2><p>${state.view==='queue'&&base.length===0?'Marque a caixa no canto das fichas para reunir o que deseja imprimir.':'Experimente outro título ou selecione o filtro Todos.'}</p><button class="btn" data-go="home">Explorar os módulos</button></div>`}`;}
function progress(){const items=archive.items.filter(i=>state.done.includes(i.id));return `<div class="page-head"><h1>O que você já construiu.</h1><p>${items.length} de 150 mapas concluídos. Marcar como estudado é um registro pessoal; não mede domínio ou chance de aprovação.</p></div><div class="stats">${[[items.length,'Mapas concluídos'],[150-items.length,'Mapas para continuar'],[Math.round(items.length/150*100)+'%','Do acervo percorrido'],[archive.modules.filter(m=>moduleCount(m.id)===m.count).length,'Módulos concluídos']].map(([v,t])=>`<div class="stat">${icon('trophy')}<div><strong>${v}</strong><span>${t}</span></div></div>`).join('')}</div>${items.length?`<div class="progress-list">${items.map(i=>`<article class="progress-row">${icon('check')}<div><h3>${escapeText(i.title)}</h3><span>${i.code} · ${escapeText(archive.modules[i.module-1].title)}</span></div><button class="btn outline" data-open="${i.id}">Revisar</button><button class="btn quiet" data-done="${i.id}" aria-label="Desmarcar ${i.code}">${icon('close')}</button></article>`).join('')}</div>`:`<div class="empty">${icon('route')}<h2>Seu percurso começa com o primeiro mapa.</h2><p>Depois de estudar uma ficha, marque como concluída. Ela aparecerá aqui e no progresso do módulo.</p><button class="btn" data-go="beginner">Abrir caminho inicial</button></div>`}`;}
function bonus(){const cards=[{n:2,title:'Simulados da Nomeação',desc:'Dois blocos de dez questões autorais de gestão de sala de aula, gabaritos comentados e indicação dos mapas para revisão.'},{n:3,title:'Prova Anterior em Ação',desc:'Trilha guiada com dez questões selecionadas de um caderno anterior da FGV, links oficiais e gabarito definitivo.'},{n:4,title:'Plano Visual de Estudo',desc:'Cinquenta sessões para percorrer os 150 mapas, com rotinas de estudo e acompanhamento de revisão.'}];return `<div class="page-head"><h1>Seu estudo encontra a prática.</h1><p>Seus quatro bônus ficam separados dos mapas. Abra os PDFs, pratique no simulado ou acesse o InfoApp de discursiva e videoaula.</p></div><div class="grid">${cards.map(b=>`<article class="module-card"><div class="bonus-cover"><img src="${asset(`capas/bonus-${String(b.n).padStart(2,'0')}.webp`)}" alt="Capa ${b.title}" loading="lazy"></div><div class="bonus-copy"><div class="eyebrow muted">BÔNUS EM PDF</div><h3 style="margin-top:8px">${b.title}</h3><p>${b.desc}</p><a class="btn outline" href="${asset(`pdfs/bonus-${String(b.n).padStart(2,'0')}.pdf`)}" target="_blank" rel="noopener" download>${icon('download')}Abrir PDF</a>${b.n===2?`<a class="btn" href="${asset('simulado/prova.html')}" target="_blank" rel="noopener">${icon('target')}Abrir simulado interativo</a>`:''}</div></article>`).join('')}<article class="module-card infoapp-card"><div class="infoapp-cover"><img src="${asset('capas/assistente-app.webp')}" alt="Assistente de Discursiva e Videoaula" loading="lazy" decoding="async"></div><div class="bonus-copy"><div class="eyebrow muted">BÔNUS 04 · INFOAPP</div><h3 style="margin-top:8px">Assistente de Discursiva e Videoaula</h3><p>Prepare a resposta, monte seu roteiro guiado, ensaie com cronômetro e retome os treinos salvos no navegador.</p><a class="btn" href="${asset('assistente/app.html')}">${icon('clipboard')}Abrir InfoApp</a><a class="btn outline" href="${asset('assistente/app.html')}?instalar=1">${icon('download')}Instalar no celular</a><p class="infoapp-caption">A análise automática e a leitura da foto serão ativadas após a conexão com IA.</p></div></article></div><div class="note">${icon('info')}<div>O simulado salva respostas no mesmo navegador, em um registro próprio. A conclusão dos mapas e os resultados dos simulados são acompanhamentos separados. O InfoApp tem seu próprio histórico de treinos e rascunhos. A análise automática depende da conexão futura com IA.</div></div>`;}
function assistant(){return `<div class="page-head"><div class="eyebrow muted">BÔNUS 04 / ASSISTENTE DE TREINO</div><h1>Sua preparação, do papel à aula.</h1><p>O InfoApp faz parte desta área. Você não precisa entrar em outro site para preparar e acompanhar seus treinos.</p></div><article class="infoapp-intro"><div class="infoapp-logo"><img src="${asset('assistente/icons/icon-192.png')}" width="80" height="80" alt="Ícone do InfoApp"></div><div><h2>Discursiva e videoaula<br>em um único app.</h2><p>Prepare a resposta, organize um roteiro com seus próprios conteúdos e ensaie antes de gravar.</p><div class="infoapp-actions"><a class="btn" href="${asset('assistente/app.html')}">${icon('clipboard')}Acessar InfoApp</a><a class="btn outline" href="${asset('assistente/app.html')}?instalar=1">${icon('download')}Instalar no celular</a></div></div></article><div class="guide-grid" style="margin-top:22px"><section class="guide-card">${icon('clipboard')}<h3>Treino discursivo</h3><p>Enunciado, foto de apoio, transcrição manual, checklist e salvamento da preparação. Leitura da foto e análise automática aguardam a conexão com IA.</p></section><section class="guide-card">${icon('clock')}<h3>Roteiro e ensaio</h3><p>Modelo guiado com os conteúdos que você informou, cronômetro com pausa e retomada, histórico e exportação em texto ou impressão/PDF.</p></section></div><div class="note">${icon('info')}<div>Abra o InfoApp para instalar. Em aparelhos compatíveis, o botão chama a instalação; no iPhone, ele orienta como adicionar à Tela de Início. O app instalado abre os treinos. Seus mapas continuam nesta área de membros.</div></div>`;}
function tips(){const blocks=[['route','Comece com um objetivo','Escolha um módulo ou use o caminho inicial. Leia o mapa, feche a imagem e tente explicar a ideia central com um exemplo. Depois confira e registre o que precisa retomar.'],['book','Use os níveis como orientação','Básico, Intermediário e Avançado são classificações editoriais para organizar a navegação dentro de cada módulo. Não são dificuldade oficial da banca, previsão de incidência ou substituto do edital.'],['print','Imprima somente o necessário','Use o botão de impressão da ficha ou marque várias caixas para montar uma fila. As imagens de leitura serão carregadas antes da janela de impressão. Escolha papel A4, orientação retrato e desative cabeçalhos/rodapés no diálogo do navegador.'],['compass','Leia em tela cheia','Clique na capa da ficha para abrir o visualizador. Use Anterior e Próxima, as teclas de seta ou Escape para fechar. Clique na imagem para ampliar a leitura.'],['shield','Entenda o salvamento','O progresso e a fila ficam neste navegador e endereço, sem banco de dados. Não há login ou sincronização. Modo privado, limpeza de dados, troca de dispositivo ou mudança de endereço podem apagar ou separar o histórico.'],['info','Abra localmente ou publique','Extraia a pasta completa e abra index.html. Mantenha fichas, miniaturas, capas, pdfs, simulado e assistente ao lado do HTML. Para disponibilizar um link aos alunos, publique toda a pasta em uma hospedagem estática. Não há controle de acesso nesta versão.']];return `<div class="page-head"><h1>Um jeito simples de usar melhor.</h1><p>Seu material pronto para consultar, estudar e levar para o papel.</p></div><div class="guide-grid">${blocks.map(([ic,t,d])=>`<section class="guide-card">${icon(ic)}<h3>${t}</h3><p>${d}</p></section>`).join('')}</div><div class="note">${icon('info')}<div>Os 150 mapas e os treinos não substituem o programa específico da sua disciplina, a bibliografia integral e as atualizações do edital. O nome do perfil apenas personaliza o navegador; não autentica o acesso.</div></div>`;}
function render(){const body=state.view==='home'?home():state.view==='progress'?progress():state.view==='bonus'?bonus():state.view==='tips'?tips():state.view==='assistant'?assistant():collection();app.innerHTML=frame(body);shade.hidden=!menuOpen;updateBar();bindImageErrors();}
function updateBar(){bar.hidden=state.selected.length===0;bar.innerHTML=`<strong>${state.selected.length} ${state.selected.length===1?'mapa selecionado':'mapas selecionados'}</strong><button class="clear" data-clear="1">Limpar seleção</button><button class="btn" data-print-selected="1">${icon('print')}Imprimir seleção</button>`;}
function bindImageErrors(){document.querySelectorAll('.preview-btn img').forEach(img=>{img.addEventListener('error',()=>{const msg=document.createElement('span');msg.className='img-error';msg.textContent='A miniatura não carregou. Recarregue a página ou confira a pasta de imagens.';img.parentNode.append(msg);},{once:true});});}
function toggleDone(id){state.done=state.done.includes(id)?state.done.filter(x=>x!==id):[...state.done,id];save();render();if(!viewer.hidden)renderViewer();}
function openViewer(id){const ids=visibleItems().map(i=>i.id);viewerIds=ids.includes(id)?ids:archive.items.filter(i=>i.module===byId(id).module).map(i=>i.id);viewerIndex=viewerIds.indexOf(id);viewReturn=document.activeElement;viewer.hidden=false;document.body.classList.add('locked');renderViewer();viewer.querySelector('[data-close-view]')?.focus();}
function renderViewer(){const item=byId(viewerIds[viewerIndex]);state.last=item.id;save();const d=state.done.includes(item.id);viewer.innerHTML=`<div class="viewer-head"><div><h2>${escapeText(item.title)}</h2><p>${item.code} · ${escapeText(archive.modules[item.module-1].title)} · Clique na imagem para ampliar</p></div><button data-close-view="1" aria-label="Fechar visualização">${icon('close')}</button></div><div class="viewer-stage"><img id="full-map" src="${asset(item.image)}" alt="${escapeText(item.code)} - ${escapeText(item.title)}"></div><div class="viewer-foot"><button class="btn outline" data-view-step="-1" ${viewerIndex===0?'disabled':''}>${icon('left')}Anterior</button><span class="position">${viewerIndex+1} de ${viewerIds.length}</span><button class="btn outline" data-view-step="1" ${viewerIndex===viewerIds.length-1?'disabled':''}>Próxima${icon('right')}</button><button class="btn ${d?'complete':'light'} done-view" data-done="${item.id}" aria-pressed="${d}">${icon(d?'check':'book')}${d?'Concluído':'Marcar como estudado'}</button><button class="btn light" data-print="${item.id}" aria-label="Imprimir este mapa">${icon('print')}</button></div>`;viewer.querySelector('#full-map').addEventListener('error',()=>{viewer.querySelector('.viewer-stage').innerHTML='<div class="viewer-error">A ficha não carregou. Recarregue a página e confira se a pasta “fichas” foi extraída junto com index.html.</div>';},{once:true});}
function closeViewer(){viewer.hidden=true;viewer.innerHTML='';document.body.classList.remove('locked');render();viewReturn?.focus();}
function showProfile(){profile.hidden=false;document.body.classList.add('locked');viewReturn=document.activeElement;profile.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="profile-title">${icon('compass')}<h2 id="profile-title">Seu espaço, seu nome.</h2><p>Como você quer ser chamado? Este perfil só personaliza sua experiência neste navegador.</p><form id="profile-form"><label for="member-name">Seu nome</label><input id="member-name" maxlength="40" autocomplete="given-name" value="${escapeText(state.name)}" required><div class="error-text" id="profile-error" role="alert"></div><div class="modal-actions"><button class="btn outline" type="button" data-close-profile="1">Agora não</button><button class="btn" type="submit">Salvar nome</button></div></form></div>`;profile.querySelector('input').focus();}
function closeProfile(){profile.hidden=true;profile.innerHTML='';document.body.classList.remove('locked');viewReturn?.focus();}
function timeoutImage(url){return new Promise((resolve,reject)=>{const img=new Image();const timer=setTimeout(()=>reject(Error('Tempo esgotado para carregar uma ficha.')),20000);img.onload=async()=>{try{if(img.decode)await img.decode();clearTimeout(timer);if(!img.naturalWidth)throw Error('Imagem vazia');resolve(img);}catch(e){reject(e);}};img.onerror=()=>{clearTimeout(timer);reject(Error('Uma ficha não carregou. Confira a pasta fichas e tente novamente.'));};img.src=url;});}
async function printSheets(ids){if(printing||!ids.length)return;printing=true;const loading=document.getElementById('loading'),root=document.getElementById('print-root');loading.hidden=false;try{const entries=ids.map(byId).filter(Boolean);const images=await Promise.all(entries.map(i=>timeoutImage(asset(i.image))));root.replaceChildren();for(const img of images){const page=document.createElement('div');page.className='print-sheet';img.alt='Mapa visual para impressão';page.append(img);root.append(page);}root.dataset.ready=String(images.length);loading.hidden=true;await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));window.print();}catch(e){warning=e.message||'Não foi possível preparar a impressão.';render();}finally{loading.hidden=true;printing=false;}}
window.addEventListener('afterprint',()=>{const r=document.getElementById('print-root');r.replaceChildren();delete r.dataset.ready;});
document.addEventListener('submit',e=>{if(e.target.id!=='profile-form')return;e.preventDefault();const name=document.getElementById('member-name').value.trim().replace(/\s+/g,' ');if(!name){document.getElementById('profile-error').textContent='Digite um nome para continuar.';return;}state.name=name.slice(0,40);save();closeProfile();render();});
document.addEventListener('input',e=>{if(e.target.id!=='search-maps')return;const pos=e.target.selectionStart;search=e.target.value;render();const field=document.getElementById('search-maps');field?.focus();try{field?.setSelectionRange(pos,pos);}catch{}});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.select){const id=Number(d.select);state.selected=e.target.checked?[...new Set([...state.selected,id])]:state.selected.filter(x=>x!==id);save();render();}if(d.selectAll){const ids=visibleItems().map(i=>i.id);state.selected=e.target.checked?[...new Set([...state.selected,...ids])]:state.selected.filter(x=>!ids.includes(x));save();render();}});
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target||target.disabled)return;const d=target.dataset;if(d.go){go(d.go);return;}if(d.menu){menuOpen=!menuOpen;render();return;}if(d.profile){showProfile();return;}if(d.closeProfile){closeProfile();return;}if(d.open){openViewer(Number(d.open));return;}if(d.done){toggleDone(Number(d.done));return;}if(d.level){level=d.level;render();return;}if(d.clear){state.selected=[];save();render();return;}if(d.print){printSheets([Number(d.print)]);return;}if(d.printSelected){printSheets([...state.selected]);return;}if(d.closeView){closeViewer();return;}if(d.viewStep){viewerIndex=Math.max(0,Math.min(viewerIds.length-1,viewerIndex+Number(d.viewStep)));renderViewer();}});
viewer.addEventListener('click',e=>{if(e.target.id==='full-map')viewer.querySelector('.viewer-stage').classList.toggle('zoomed');});
shade.addEventListener('click',()=>{menuOpen=false;render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!profile.hidden)closeProfile();else if(!viewer.hidden)closeViewer();else if(menuOpen){menuOpen=false;render();}return;}if(!viewer.hidden&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();viewerIndex=Math.max(0,Math.min(viewerIds.length-1,viewerIndex+(e.key==='ArrowRight'?1:-1)));renderViewer();}if(e.key==='Tab'&&(!profile.hidden||!viewer.hidden)){const container=!profile.hidden?profile:viewer;const nodes=[...container.querySelectorAll('button:not(:disabled),input,a[href]')];const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
window.addEventListener('storage',e=>{if(e.key===storeKey){state=load();render();}});
try{if(!archive||!Array.isArray(archive.items)||archive.items.length!==150||archive.modules.length!==12)throw Error('O catálogo de mapas não carregou. Recarregue a página ou extraia novamente o pacote completo.');state=load();try{localStorage.setItem(storeKey+'_check','1');localStorage.removeItem(storeKey+'_check');}catch(e){localOK=false;warning='O navegador bloqueou o armazenamento. Você pode estudar e imprimir, mas o progresso desta sessão não ficará salvo.';}render();if(!state.name)showProfile();}catch(e){app.innerHTML=`<main style="max-width:650px;margin:10vh auto;padding:30px"><h1>Não foi possível abrir sua área.</h1><p style="margin:20px 0">${escapeText(e.message||'Recarregue a página e confira os arquivos do pacote.')}</p><button onclick="location.reload()">Recarregar página</button></main>`;}
}catch(fatal){const root=document.getElementById('app');root.textContent='Não foi possível carregar a área. Recarregue a página ou extraia novamente o pacote completo. Detalhe: '+(fatal.message||'erro de inicialização');root.style.padding='40px';}
})();
</script></body></html>
